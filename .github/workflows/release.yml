name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      COMMAND_CENTER_URL: ${{ vars.COMMAND_CENTER_URL }}
      COMMAND_CENTER_INGEST_TOKEN: ${{ secrets.COMMAND_CENTER_INGEST_TOKEN }}
      APP_ENVIRONMENT: production
      RELEASE_CHANNEL: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $versionLine = Get-Content ".\pubspec.yaml" |
            Where-Object { $_ -match '^version:\s*([^\s]+)$' } |
            Select-Object -First 1

          if (-not $versionLine) {
            throw "Nao foi possivel encontrar a versao no pubspec.yaml."
          }

          $rawVersion = (($versionLine -split ':\s*', 2)[1]).Trim()
          if ($rawVersion -notmatch '^(?<buildName>\d+\.\d+\.\d+)\+(?<buildNumber>\d+)$') {
            throw "A versao '$rawVersion' nao esta no formato esperado buildName+buildNumber."
          }

          $expectedTag = "v$($Matches.buildName)"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag invalida. Esperado: $expectedTag. Recebido: ${{ github.ref_name }}."
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Run smoke tests
        run: flutter test test/core/app_basics_test.dart

      - name: Build installer
        shell: pwsh
        run: .\scripts\build_windows_installer.ps1

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/installer/*.exe
            artifacts/release/*.zip
