name: code_trail_windows
description: "CodeTrail for Windows desktop, based on the stable Android tablet app."
publish_to: 'none'

version: 1.3.5+29

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  supabase_flutter: ^2.12.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.10
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  flutter_local_notifications: ^19.4.2
  flutter_svg: ^2.2.1
  google_fonts: ^8.0.2
  http: ^1.5.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: ^8.3.1
  collection: ^1.19.1
  equatable: ^2.0.8
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  drift_dev: ^2.32.0

flutter:
  uses-material-design: true
  assets:
    - CodeTrail.svg
    - assets/design/background.webp
    - assets/design/app_icon.png
    - assets/design/CodeTrailMainIcon.png
